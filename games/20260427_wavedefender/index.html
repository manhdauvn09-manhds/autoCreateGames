<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WaveDefender</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#00d4ff,#00a8ff);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}#game{position:relative;width:100vw;height:100vh;max-width:500px;max-height:800px;background:linear-gradient(135deg,#001a33,#003366);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)}canvas{display:block;width:100%;height:100%}#ui{position:absolute;top:10px;left:10px;right:10px;color:#00ffff;font-weight:bold;text-shadow:0 0 10px #00ffff;z-index:10;display:flex;justify-content:space-between}#tutorial{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#00ffff;text-align:center;z-index:50}#tutorial p{margin:15px;font-size:1.2em}#tutorial.hidden{display:none}</style></head><body><div id="game"><canvas id="canvas"></canvas><div id="ui"><div id="wave">Wave: 1</div><div id="gold">Gold: 100</div><div id="health">❤️ 3</div></div><div id="tutorial"><p>🛡️ WAVE DEFENDER 🛡️</p><p>Click to place towers!</p><p>Survive the waves!</p><p>Click to start...</p></div></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=500;canvas.height=800;const state={gold:100,health:3,wave:1,gameRunning:false,towers:[],enemies:[],gameTime:0};function initGame(){state.gameRunning=true;document.getElementById('tutorial').classList.add('hidden');}function placeTower(x,y){if(state.gold<30)return;state.gold-=30;state.towers.push({x,y,range:100,damage:10,cooldown:0});}function update(){if(!state.gameRunning)return;state.gameTime++;if(state.gameTime%100===0&&state.enemies.length<5+state.wave){const x=Math.random()*(canvas.width-40);state.enemies.push({x,y:-20,size:15,hp:1+state.wave,speed:1+state.wave*0.2});}for(let e of state.enemies){e.y+=e.speed;for(let t of state.towers){const dx=t.x-e.x;const dy=t.y-e.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<t.range&&t.cooldown<=0){e.hp-=t.damage;t.cooldown=20;if(e.hp<=0){state.gold+=10;}}if(t.cooldown>0)t.cooldown--;}if(e.y>canvas.height){state.health--;if(state.health<=0){state.gameRunning=false;}state.enemies.splice(state.enemies.indexOf(e),1);}}document.getElementById('wave').textContent='Wave: '+state.wave;document.getElementById('gold').textContent='Gold: '+state.gold;document.getElementById('health').textContent='❤️ '+state.health;}function draw(){ctx.fillStyle='#001a33';ctx.fillRect(0,0,canvas.width,canvas.height);state.towers.forEach(t=>{ctx.fillStyle='#ffff00';ctx.fillRect(t.x-15,t.y-15,30,30);ctx.strokeStyle='#ffff0088';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.stroke();});state.enemies.forEach(e=>{ctx.fillStyle='#ff0000';ctx.fillRect(e.x-e.size/2,e.y,e.size,e.size);});if(!state.gameRunning){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ffff';ctx.font='bold 2em Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',250,350);ctx.font='1.2em Arial';ctx.fillText('Wave: '+state.wave,250,400);}}function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}canvas.addEventListener('click',(e)=>{if(!state.gameRunning){initGame();}else{const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;placeTower(x,y);}});gameLoop();</script></body></html>
