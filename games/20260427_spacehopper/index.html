<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SpaceHopper</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}#game{position:relative;width:100vw;height:100vh;max-width:500px;max-height:800px;background:linear-gradient(to bottom,#000033,#001155);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)}canvas{display:block;width:100%;height:100%}#ui{position:absolute;top:15px;left:15px;color:#00ffff;text-shadow:0 0 10px #00ffff;font-weight:bold;font-size:1.1em;z-index:10}#score{margin-bottom:10px}#tutorial{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#00ffff;text-align:center;text-shadow:0 0 10px #00ffff;z-index:50;font-size:1.3em}#tutorial p{margin:20px}#tutorial.hidden{display:none}</style></head><body><div id="game"><canvas id="canvas"></canvas><div id="ui"><div id="score">Score: 0</div><div id="height">Height: 0m</div></div><div id="tutorial"><p>🚀 TAP TO JUMP! 🚀</p><p>Tap anywhere to start!</p></div></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=500;canvas.height=800;let player={x:250,y:650,size:25,vy:0};let platforms=[];let score=0;let height=0;let gameRunning=false;let gameStarted=false;function createPlatform(){const platform={x:Math.random()*(canvas.width-60)+30,y:Math.random()*400,width:60,height:10,color:`hsl(${Math.random()*60+180},100%,50%)`};platforms.push(platform);return platform;}function initGame(){platforms=[];for(let i=0;i<8;i++){createPlatform();}score=0;height=0;player.y=650;player.vy=0;gameRunning=true;gameStarted=true;document.getElementById('tutorial').classList.add('hidden');}function update(){if(!gameRunning)return;player.vy+=0.6;player.y+=player.vy;for(let p of platforms){if(player.vy>0&&player.y+player.size>=p.y&&player.y+player.size<=p.y+p.height+5&&player.x+player.size/2>=p.x&&player.x+player.size/2<=p.x+p.width){player.vy=-12;score+=10;height=Math.max(height,Math.floor(canvas.height*0.8-player.y));}if(p.y>canvas.height){platforms.splice(platforms.indexOf(p),1);createPlatform();}}if(player.y>canvas.height){gameRunning=false;}document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('height').textContent=`Height: ${Math.max(0,Math.floor((canvas.height*0.8-player.y)/10))}m`;}function draw(){ctx.fillStyle='#000033';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ffff';ctx.shadowColor='#00ffff';ctx.shadowBlur=20;ctx.fillRect(player.x-player.size/2,player.y,player.size,player.size);ctx.shadowBlur=0;for(let p of platforms){ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillRect(p.x,p.y,p.width,p.height);ctx.shadowBlur=0;}if(!gameRunning&&gameStarted){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ffff';ctx.font='bold 2em Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',250,350);ctx.font='1.2em Arial';ctx.fillText(`Score: ${score}`,250,400);}}function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}canvas.addEventListener('click',()=>{if(!gameStarted){initGame();}else if(!gameRunning){initGame();}});document.addEventListener('keydown',(e)=>{if(e.key===' '){if(!gameStarted){initGame();}else if(!gameRunning){initGame();}}});gameLoop();</script></body></html>
