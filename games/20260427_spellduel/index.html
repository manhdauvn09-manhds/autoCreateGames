<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SpellDuel</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#9d4edd,#5a189a);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:500px;background:linear-gradient(135deg,#240046,#3c096c);border-radius:15px;padding:15px;box-shadow:0 20px 60px rgba(0,0,0,0.5);color:#d0d0ff}#battle{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}#player,#enemy{background:rgba(0,0,0,0.3);border:2px solid #9d4edd;border-radius:10px;padding:15px;text-align:center}#player{border-color:#00ff88}#enemy{border-color:#ff0000}#hand{margin-bottom:20px}h3{color:#d0d0ff;margin-bottom:10px;text-align:center}.card{display:inline-block;background:linear-gradient(135deg,#9d4edd,#5a189a);border:2px solid #d0d0ff;border-radius:8px;padding:8px 12px;margin:5px;cursor:pointer;transition:all 0.3s}.card:hover{transform:translateY(-5px);box-shadow:0 5px 15px rgba(157,78,221,0.5)}.card.selected{background:linear-gradient(135deg,#d0d0ff,#b0b0ff);color:#000;border-color:#fff}#log{background:rgba(0,0,0,0.3);border:1px solid #444;border-radius:8px;padding:10px;height:100px;overflow-y:auto;font-size:0.8em;color:#aaa}</style></head><body><div id="game"><div id="battle"><div id="player"><div id="p-name">YOU</div><div id="p-health">❤️ 50 HP</div><div id="p-deck">Deck: 10</div></div><div id="enemy"><div id="e-name">OPPONENT</div><div id="e-health">❤️ 50 HP</div><div id="e-deck">Deck: 10</div></div></div><div id="hand"><h3>Your Spells</h3><div id="card-list"></div></div><div id="log"></div></body></html><script>const spells=['Fireball','Frost','Lightning','Heal','Shield','Curse','Meteor','Wave'];const state={playerHP:50,enemyHP:50,playerDeck:10,enemyDeck:10,hand:[],selectedCard:null};function initHand(){state.hand=[];for(let i=0;i<3;i++){state.hand.push(spells[Math.floor(Math.random()*spells.length)]);}renderHand();}function renderHand(){const list=document.getElementById('card-list');list.innerHTML='';state.hand.forEach((card,i)=>{const el=document.createElement('button');el.className='card'+(state.selectedCard===i?' selected':'');el.textContent=card;el.onclick=()=>{state.selectedCard=state.selectedCard===i?null:i;renderHand();};list.appendChild(el);});document.getElementById('p-deck').textContent='Deck: '+state.playerDeck;}function playCard(){if(state.selectedCard===null)return;const card=state.hand[state.selectedCard];const damage=Math.floor(Math.random()*15)+5;const log=document.getElementById('log');log.innerHTML+=`<div>You cast ${card}! (${damage} damage)</div>`;state.enemyHP=Math.max(0,state.enemyHP-damage);state.hand.splice(state.selectedCard,1);state.selectedCard=null;state.playerDeck--;if(Math.random()>0.3){const enemyCard=spells[Math.floor(Math.random()*spells.length)];const enemyDmg=Math.floor(Math.random()*10)+3;log.innerHTML+=`<div style="color:#ff6666">Enemy casts ${enemyCard}! (${enemyDmg} damage)</div>`;state.playerHP=Math.max(0,state.playerHP-enemyDmg);}drawCard();updateUI();if(state.enemyHP<=0){log.innerHTML+='<div style="color:#00ff88">YOU WIN!</div>';}}function drawCard(){if(state.playerDeck>0&&state.hand.length<5){state.hand.push(spells[Math.floor(Math.random()*spells.length)]);}}function updateUI(){document.getElementById('p-health').textContent='❤️ '+state.playerHP+' HP';document.getElementById('e-health').textContent='❤️ '+state.enemyHP+' HP';document.getElementById('p-deck').textContent='Deck: '+state.playerDeck;renderHand();if(state.selectedCard!==null){const attack=Math.floor(Math.random()*15)+5;const btn=document.createElement('button');btn.className='card';btn.textContent='⚔️ CAST!';btn.style.marginLeft='10px';btn.style.color='#ff0000';btn.onclick=playCard;document.getElementById('card-list').appendChild(btn);}}initHand();updateUI();</script></body></html>
