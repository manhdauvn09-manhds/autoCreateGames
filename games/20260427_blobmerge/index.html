<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BlobMerge</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:500px;height:600px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:15px;padding:15px;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:flex;flex-direction:column}#header{color:#00ff88;text-shadow:0 0 10px #00ff88;font-weight:bold;margin-bottom:15px}#grid{flex:1;background:rgba(0,0,0,0.3);border:2px solid #00ff88;border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto}#score,#combo{margin-right:20px}#score{color:#00ff88}#combo{color:#ff00ff}.blob{width:100%;aspect-ratio:1;background:radial-gradient(circle,hsl(var(--hue),100%,60%),hsl(var(--hue),80%,40%));border-radius:50%;display:flex;justify-content:center;align-items:center;color:white;font-weight:bold;cursor:grab;font-size:0.8em;user-select:none;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:all 0.3s}.blob:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,0.5)}.blob.dragging{cursor:grabbing;opacity:0.7}.blob.size1{font-size:0.9em}.blob.size2{font-size:1.1em}.blob.size3{font-size:1.3em}.blob.size4{font-size:1.5em}#feedback{color:#00ff88;text-align:center;font-size:0.9em;min-height:20px;margin-bottom:10px}</style></head><body><div id="game"><div id="header"><div id="score">Score: 0</div><div id="combo">Merges: 0</div></div><div id="feedback"></div><div id="grid"></div></div><script>const state={score:0,merges:0,blobs:[],draggedBlob:null};function createBlob(level=1){return{id:Math.random(),level:level,hue:Math.floor(Math.random()*360)};}function initGrid(){state.blobs=[];for(let i=0;i<6;i++){state.blobs.push(createBlob(Math.floor(Math.random()*3)+1));}render();}function render(){const grid=document.getElementById('grid');grid.innerHTML='';state.blobs.forEach((blob,i)=>{const el=document.createElement('div');el.className='blob size'+Math.min(blob.level,4);el.style.setProperty('--hue',blob.hue);el.textContent=blob.level;el.draggable=true;el.addEventListener('dragstart',(e)=>{state.draggedBlob=i;});el.addEventListener('dragover',(e)=>{e.preventDefault();});el.addEventListener('drop',(e)=>{e.preventDefault();merge(i);});grid.appendChild(el);});updateUI();}function merge(targetIdx){if(state.draggedBlob===null||state.draggedBlob===targetIdx)return;const src=state.blobs[state.draggedBlob];const tgt=state.blobs[targetIdx];if(src.level===tgt.level){tgt.level+=1;state.blobs.splice(state.draggedBlob,1);state.score+=tgt.level*tgt.level*10;state.merges+=1;document.getElementById('feedback').textContent='✨ Merged!';setTimeout(()=>{document.getElementById('feedback').textContent=''},1000);addNewBlob();}state.draggedBlob=null;render();}function addNewBlob(){state.blobs.push(createBlob(1));render();}function updateUI(){document.getElementById('score').textContent='Score: '+state.score;document.getElementById('combo').textContent='Merges: '+state.merges;}initGrid();</script></body></html>
