<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenZ Web Game Factory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .tagline {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .game-card:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .game-card h3 {
      margin-bottom: 8px;
      font-size: 1.3em;
    }

    .game-tagline {
      font-size: 0.9em;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .play-btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .date-label {
      font-size: 0.8em;
      opacity: 0.6;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      opacity: 0.7;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 GenZ Web Game Factory</h1>
      <p class="tagline">Fresh browser games generated daily from trending inspirations</p>
    </header>

    <div id="games-container" class="games-grid">
      <!-- Games will be inserted here -->
    </div>

    <footer>
      <p>Made with ✨ and JavaScript. Play, enjoy, and check back tomorrow for new games!</p>
    </footer>
  </div>

  <script>
    const GAMES = [
      {name: "🎵 BeatJump", tagline: "Tap to jump on the rhythm! Dodge platforms and maintain your combo.", path: "games/20260427_beatjump/index.html", date: "2026-04-27"},
      {name: "📝 FastLetters", tagline: "Type words from the letters! Speed and creativity = high scores.", path: "games/20260427_fastletters/index.html", date: "2026-04-27"},
      {name: "🚀 SpaceHopper", tagline: "Jump on platforms to reach higher! Simple, addictive, endless.", path: "games/20260427_spacehopper/index.html", date: "2026-04-27"},
      {name: "🏍️ StuntDash", tagline: "Flip through obstacles! Sick tricks = big points.", path: "games/20260427_stuntdash/index.html", date: "2026-04-27"},
      {name: "💰 TapFactory", tagline: "Tap for cash! Buy upgrades! Watch the money grow.", path: "games/20260427_tapfactory/index.html", date: "2026-04-27"},
      {name: "🌀 BlobMerge", tagline: "Drag matching blobs to merge! Level up for big points.", path: "games/20260427_blobmerge/index.html", date: "2026-04-27"},
      {name: "💎 GemBlast", tagline: "Swap gems to match 3! Clear the board for points.", path: "games/20260427_gemblast/index.html", date: "2026-04-27"},
      {name: "✨ SpellDuel", tagline: "Cast spells in tactical duels! Build your deck and dominate.", path: "games/20260427_spellduel/index.html", date: "2026-04-27"},
      {name: "🛡️ WaveDefender", tagline: "Place towers to stop enemies! Build your defense!", path: "games/20260427_wavedefender/index.html", date: "2026-04-27"},
      {name: "🎯 ClickSync", tagline: "Click on the beat! Perfect timing = perfect score.", path: "games/20260427_clicksync/index.html", date: "2026-04-27"}
    ];

    function renderGames() {
      const container = document.getElementById('games-container');
      GAMES.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <h3>${game.name}</h3>
          <p class="game-tagline">${game.tagline}</p>
          <a href="${game.path}" class="play-btn">Play Now →</a>
          <div class="date-label">Added: ${game.date}</div>
        `;
        container.appendChild(card);
      });
    }

    renderGames();
  </script>
</body>
</html>
