<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ClickSync</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff6b9d,#ff8787);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:500px;background:linear-gradient(135deg,#2d1b2e,#3d2741);border-radius:15px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.5);text-align:center;color:#ff88ff}h1{margin-bottom:30px;font-size:2em;text-shadow:0 0 15px #ff88ff}#target{position:relative;width:200px;height:200px;margin:0 auto 30px;background:radial-gradient(circle,#ff1493,#ff00ff);border-radius:50%;border:3px solid #ff88ff;display:flex;justify-content:center;align-items:center;font-size:3em;cursor:pointer;transition:all 0.1s;box-shadow:0 0 30px rgba(255,0,255,0.5)}#target.hit{animation:hit 0.2s ease-out;box-shadow:0 0 50px rgba(255,0,255,0.8)}@keyframes hit{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}#stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:30px;font-weight:bold;font-size:1.1em}#stats div{background:rgba(0,0,0,0.3);padding:15px;border-radius:8px;border:2px solid #ff88ff}#score{color:#00ff88}#combo{color:#ffff00}#accuracy{color:#ff88ff}#feedback{min-height:30px;font-size:1.3em;margin-top:20px;font-weight:bold;color:#ffff00}#tutorial{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#ff88ff;text-align:center;z-index:50}#tutorial p{margin:15px;font-size:1.2em}#tutorial button{padding:12px 30px;background:linear-gradient(135deg,#ff1493,#ff00ff);color:white;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:20px}#tutorial.hidden{display:none}</style></head><body><div id="game"><h1>🎯 ClickSync 🎯</h1><div id="target">●</div><div id="feedback"></div><div id="stats"><div><div>Score</div><div id="score">0</div></div><div><div>Combo</div><div id="combo">0x</div></div><div><div>Accuracy</div><div id="accuracy">0%</div></div></div></div><div id="tutorial"><p>🎯 CLICK THE BEAT! 🎯</p><p>Follow the rhythm and hit perfectly!</p><p id="timer">5</p><button onclick="startGame()">START</button></div><script>const state={score:0,combo:0,accuracy:0,clicks:0,hits:0,gameRunning:false,beat:0};let nextBeatTime=0;function startGame(){document.getElementById('tutorial').classList.add('hidden');state.gameRunning=true;state.score=0;state.combo=0;state.clicks=0;state.hits=0;nextBeatTime=Date.now();}function update(){if(!state.gameRunning)return;const now=Date.now();if(now>=nextBeatTime){nextBeatTime+=500;state.beat++;const target=document.getElementById('target');target.style.background=`radial-gradient(circle, hsl(${Math.random()*360},100%,60%), hsl(${Math.random()*360},100%,40%))`;if(state.beat>30){state.gameRunning=false;updateUI();}}}function click(){if(!state.gameRunning)return;state.clicks++;const now=Date.now();const timeToBeat=nextBeatTime-now;const accuracy=Math.max(0,100-Math.abs(timeToBeat));if(accuracy>70){state.hits++;state.combo++;const points=Math.floor(accuracy*10)+state.combo*5;state.score+=points;document.getElementById('target').classList.add('hit');document.getElementById('feedback').textContent=`⭐ ${Math.floor(accuracy)}% PERFECT! +${points}`;setTimeout(()=>{document.getElementById('target').classList.remove('hit');},200);}else{state.combo=0;document.getElementById('feedback').textContent='❌ Miss!';}updateUI();}function updateUI(){if(state.clicks>0){state.accuracy=Math.floor((state.hits/state.clicks)*100);}document.getElementById('score').textContent=state.score;document.getElementById('combo').textContent=state.combo+'x';document.getElementById('accuracy').textContent=state.accuracy+'%';if(!state.gameRunning&&state.score>0){document.getElementById('feedback').innerHTML+=`<br/>Final: ${state.score} pts, ${state.accuracy}% accuracy`;}else if(!state.gameRunning&&state.clicks===0){}else if(!state.gameRunning){const timerEl=document.getElementById('timer');if(timerEl){timerEl.textContent='Game Over!';}document.getElementById('tutorial').classList.remove('hidden');}else if(document.getElementById('tutorial').classList.contains('hidden')){const remaining=31-state.beat;document.getElementById('timer').textContent=`Beats: ${state.beat}/30`;}}document.getElementById('target').addEventListener('click',()=>{if(!state.gameRunning){startGame();}else{click();}});setInterval(update,16);</script></body></html>
