<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TapFactory</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#d4a574,#a67c52);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:500px;background:linear-gradient(135deg,#3d2817,#5c3d2e);border-radius:15px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);color:#f0e68c;text-align:center}h1{margin-bottom:20px;font-size:2em;color:#ffd700;text-shadow:0 0 10px #ffd700}#stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;font-weight:bold}#stats div{background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;border:1px solid #ffd700}#money{font-size:1.5em;color:#00ff88}#rate{color:#ff00ff}#total{color:#00ffff}#clicker{width:100%;padding:40px;margin:20px 0;background:linear-gradient(135deg,#ffd700,#ffed4e);border:none;border-radius:15px;font-size:3em;cursor:pointer;transition:all 0.2s;box-shadow:0 5px 20px rgba(255,215,0,0.5)}#clicker:active{transform:scale(0.95);box-shadow:0 2px 10px rgba(255,215,0,0.3)}#upgrades{margin-top:20px}h3{color:#ffd700;margin-bottom:15px}.upgrade{background:rgba(0,0,0,0.3);padding:12px;margin:8px 0;border:1px solid #666;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all 0.3s}.upgrade:hover{background:rgba(255,215,0,0.1);border-color:#ffd700}.upgrade.disabled{opacity:0.5;cursor:not-allowed}.upgrade-info{text-align:left}.upgrade-cost{color:#ff00ff;font-weight:bold;margin-right:10px}</style></head><body><div id="game"><h1>💰 TapFactory 💰</h1><div id="stats"><div><div>#️⃣ Cash</div><div id="money">$0</div></div><div><div>📈 Rate</div><div id="rate">$0/s</div></div><div><div>🎯 Total</div><div id="total">$0</div></div></div><button id="clicker">TAP 👆</button><div id="upgrades"><h3>Upgrades</h3><div id="upgrade-list"></div></div></div><script>const state={money:0,totalMoney:0,rate:0,upgrades:{clicker:1,auto:0,mega:0}};const upgradeCosts={clicker:10,auto:100,mega:1000};const upgradeNames={clicker:'Better Clicker',auto:'Auto Tapper',mega:'Mega Bot'};function updateUI(){document.getElementById('money').textContent='$'+Math.floor(state.money);document.getElementById('rate').textContent='$'+state.rate.toFixed(1)+'/s';document.getElementById('total').textContent='$'+Math.floor(state.totalMoney);updateUpgrades();}function updateUpgrades(){const list=document.getElementById('upgrade-list');list.innerHTML='';for(let key in upgradeCosts){const cost=upgradeCosts[key];const affordable=state.money>=cost;const el=document.createElement('div');el.className='upgrade'+(affordable?'':' disabled');el.innerHTML=`<div class="upgrade-info"><strong>${upgradeNames[key]}</strong><br/>Level: ${state.upgrades[key]}</div><span class="upgrade-cost">$${cost}</span>`;if(affordable){el.addEventListener('click',()=>buyUpgrade(key));}list.appendChild(el);}}function buyUpgrade(key){const cost=upgradeCosts[key];if(state.money<cost)return;state.money-=cost;state.upgrades[key]++;if(key==='clicker'){upgradeCosts.clicker=Math.floor(upgradeCosts.clicker*1.15);}else{state.rate+=key==='auto'?1:5;upgradeCosts[key]=Math.floor(upgradeCosts[key]*1.2);}updateUI();}function click(){state.money+=5*state.upgrades.clicker;state.totalMoney+=5*state.upgrades.clicker;updateUI();}document.getElementById('clicker').addEventListener('click',click);setInterval(()=>{state.money+=state.rate;state.totalMoney+=state.rate;updateUI();},1000);updateUI();</script></body></html>
