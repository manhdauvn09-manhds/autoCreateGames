<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GemBlast</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff1493,#ff69b4);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:500px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:15px;padding:15px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}#header{color:#ff1493;text-shadow:0 0 10px #ff1493;font-weight:bold;margin-bottom:15px;display:flex;justify-content:space-between}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px;background:rgba(0,0,0,0.3);padding:10px;border-radius:10px}.gem{aspect-ratio:1;background:radial-gradient(circle,hsl(var(--hue),100%,70%),hsl(var(--hue),100%,40%));border-radius:8px;cursor:pointer;font-weight:bold;color:white;display:flex;justify-content:center;align-items:center;user-select:none;transition:all 0.2s;box-shadow:0 4px 10px rgba(0,0,0,0.4)}.gem:hover{transform:scale(1.1);box-shadow:0 6px 15px rgba(0,0,0,0.6)}.gem.matched{animation:pop 0.5s ease-out}.gem.selected{border:3px solid white;transform:scale(0.95)}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(0)}}#feedback{color:#ff1493;text-align:center;min-height:20px;font-weight:bold;margin-bottom:10px}</style></head><body><div id="game"><div id="header"><div id="score">Score: 0</div><div id="moves">Moves: 5</div></div><div id="feedback"></div><div id="grid"></div></div><script>const colors=['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff'];const state={grid:[],score:0,moves:5,selected:null};function init(){state.grid=[];for(let i=0;i<25;i++){state.grid.push(Math.floor(Math.random()*5));}state.score=0;state.moves=5;render();}function checkMatches(){let anyMatched=false;const toRemove=new Set();for(let row=0;row<5;row++){for(let col=0;col<5;col++){const idx=row*5+col;const color=state.grid[idx];if(color===-1)continue;let count=1;let right=col+1;while(right<5&&state.grid[row*5+right]===color)count++,right++;if(count>=3){for(let c=col;c<right;c++)toRemove.add(row*5+c);anyMatched=true;}let down=row+1;count=1;while(down<5&&state.grid[down*5+col]===color)count++,down++;if(count>=3){for(let r=row;r<down;r++)toRemove.add(r*5+col);anyMatched=true;}}}for(let i of toRemove){state.grid[i]=-1;state.score+=10;}if(anyMatched){setTimeout(dropGems,100);}return anyMatched;}function dropGems(){for(let col=0;col<5;col++){let fillPos=24-col*5;for(let row=4;row>=0;row--){const idx=row*5+col;if(state.grid[idx]!==-1){const temp=state.grid[idx];state.grid[idx]=-1;state.grid[fillPos]=temp;fillPos-=5;}}}}function swap(idx1,idx2){const temp=state.grid[idx1];state.grid[idx1]=state.grid[idx2];state.grid[idx2]=temp;state.moves--;if(checkMatches()){if(state.moves<=0){document.getElementById('feedback').textContent='Game Over!';}render();}else{const temp2=state.grid[idx1];state.grid[idx1]=state.grid[idx2];state.grid[idx2]=temp2;render();}}function render(){const grid=document.getElementById('grid');grid.innerHTML='';state.grid.forEach((color,i)=>{const el=document.createElement('div');if(color!==-1){el.className='gem';el.style.setProperty('--hue',colors[color]);el.addEventListener('click',()=>{if(state.selected===null){state.selected=i;}else{swap(state.selected,i);state.selected=null;}});grid.appendChild(el);}});document.getElementById('score').textContent='Score: '+state.score;document.getElementById('moves').textContent='Moves: '+Math.max(0,state.moves);}init();</script></body></html>
