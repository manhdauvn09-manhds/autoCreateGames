<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StuntDash</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff6b35,#f7931e);display:flex;justify-content:center;align-items:center;min-height:100vh}#game{position:relative;width:100vw;height:100vh;max-width:500px;max-height:800px;background:linear-gradient(to bottom,#87CEEB,#90EE90);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)}canvas{display:block;width:100%;height:100%}#ui{position:absolute;top:15px;left:15px;color:#222;font-weight:bold;font-size:1.1em;z-index:10}#score{margin-bottom:10px}#tutorial{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#ffff00;text-align:center;text-shadow:0 0 10px #ffff00;z-index:50;font-size:1.3em}#tutorial p{margin:20px}#tutorial.hidden{display:none}</style></head><body><div id="game"><canvas id="canvas"></canvas><div id="ui"><div id="score">Score: 0</div></div><div id="tutorial"><p>🏍️ STUNT DASH 🏍️</p><p>Tap to flip! Land smooth!</p><p>Tap to start...</p></div></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=500;canvas.height=800;let player={x:250,y:600,size:30,angle:0,vy:0,isFlipping:false};let obstacles=[];let score=0;let gameRunning=false;let gameStarted=false;function initGame(){obstacles=[];score=0;player.angle=0;player.vy=0;gameRunning=true;gameStarted=true;document.getElementById('tutorial').classList.add('hidden');}function createObstacle(){obstacles.push({x:Math.random()*(canvas.width-40)+20,y:-40,width:40,height:20,type:Math.random()>0.5?'gap':'spike'});}function update(){if(!gameRunning)return;if(Math.random()<0.02){createObstacle();}player.vy+=0.8;player.y+=player.vy;if(player.isFlipping){player.angle+=0.2;}obstacles.forEach((o,i)=>{o.y+=5;if(player.y+player.size/2>=o.y&&player.y+player.size/2<=o.y+o.height&&player.x>=o.x-10&&player.x<=o.x+o.width+10){if(o.type==='gap'&&player.isFlipping){score+=50;player.isFlipping=false;}else if(o.type==='spike'){gameRunning=false;}}if(o.y>canvas.height){obstacles.splice(i,1);score+=10;}});if(player.y>canvas.height){gameRunning=false;}document.getElementById('score').textContent=`Score: ${score}`;}function draw(){ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff6b35';ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);ctx.restore();obstacles.forEach(o=>{ctx.fillStyle=o.type==='gap'?'#00ff00':'#ff0000';ctx.fillRect(o.x,o.y,o.width,o.height);});if(!gameRunning&&gameStarted){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffff00';ctx.font='bold 2em Arial';ctx.textAlign='center';ctx.fillText('WIPEOUT!',250,350);ctx.font='1.2em Arial';ctx.fillText(`Score: ${score}`,250,400);}}function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}canvas.addEventListener('click',()=>{if(!gameStarted){initGame();}else if(!gameRunning){initGame();}else{player.isFlipping=true;}});document.addEventListener('keydown',(e)=>{if(e.key===' '){if(!gameStarted){initGame();}else if(!gameRunning){initGame();}else{player.isFlipping=true;}}});gameLoop();</script></body></html>
