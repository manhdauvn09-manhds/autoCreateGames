version: '3.8'

services:
  games:
    build: .
    container_name: genz-minigames
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./games:/app/games
      - ./daily:/app/daily
      - ./state:/app/state
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: genz-games-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./games:/usr/share/nginx/html/games:ro
    depends_on:
      - games
    restart: always
